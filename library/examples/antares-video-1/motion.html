<style>
:root{--b:#2563eb;--ink:#0a0a0a;--n9:#171717;--n7:#404040;--n6:#525252;--n5:#737373;--n4:#a1a1a1;--n3:#d4d4d4;--n2:#e5e5e5;--n1:#f5f5f5;--red:#bf000f;--redbg:#fef2f2;--amb:#fcbb00;--ambt:#b75000;--ok:#00c758;

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;font-family:var(--hv);color:var(--n9);background:#fff}
#stage.ink{background:var(--ink);color:#fff}
.c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center}
.h{font-weight:700;letter-spacing:-.045em;line-height:.95}
.lab{font-size:56px;font-weight:700;letter-spacing:-.03em}
.sub{font-size:44px;color:var(--n6);letter-spacing:-.01em}
.ink .sub{color:rgba(255,255,255,.7)}
.mono{font-family:var(--mono)}

.wb{position:relative;border-radius:22px;background:#fff;border:4px solid var(--n2);overflow:hidden;flex:none}
.wb .bar{position:absolute;left:10%;right:10%;top:9%;height:9%;border-radius:6px;background:var(--n1)}
.wb .p{position:absolute;border-radius:8px;background:var(--n1)}
.wb.blue{border-color:var(--b)}.wb.blue .p,.wb.blue .bar{background:#dbe6fd}
.wb.red{border-color:var(--red)}.wb.amb{border-color:var(--amb)}
.wb.ghost{border-style:dashed;border-color:var(--n3)}.wb.ghost .p,.wb.ghost .bar{background:#fafafa}
.dot{position:absolute;border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:22px;height:120px;padding:0 48px;border-radius:999px;background:var(--n1);font-size:52px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.chip.on{background:var(--b);color:#fff}
.chip.out{background:#fff;border:4px solid var(--n2)}
.cur{position:absolute;width:96px;height:112px}
.ring{position:absolute;border:8px solid var(--b);border-radius:28px}
.big{font-size:300px;font-weight:700;letter-spacing:-.06em;line-height:.9}
.strike{position:absolute;left:-4%;right:-4%;top:50%;height:16px;margin-top:-8px;background:var(--red);border-radius:8px}
.pill{display:inline-flex;align-items:center;height:96px;padding:0 40px;border-radius:999px;font-size:48px;font-weight:700}
.icon{display:block}
.card{background:#fff;border:4px solid var(--n2);border-radius:36px}
.ink .card{background:#171717;border-color:#2a2a2a}
.grid{display:grid}
.x{position:absolute;left:24px;bottom:16px;font-size:20px;color:var(--n6)}
.hl{background:linear-gradient(#2563eb,#2563eb) no-repeat 0 0/0% 100%;border-radius:12px;padding:0 10px;margin:0 -6px}
.layer{position:absolute;inset:0;overflow:hidden;background:#fff;color:var(--n9);transform-origin:50% 50%}
.layer.ink{background:var(--ink);color:#fff}
.pop{position:absolute;z-index:5}
.pc{will-change:transform}.pc .wb{transition:none}
.pc.on .wb{border-color:#2563eb;border-width:8px}.pc.seen .wb{border-color:#9db8f7}.pc.seen .wb .p,.pc.seen .wb .bar,.pc.on .wb .p,.pc.on .wb .bar{background:#dbe6fd}
.rip{position:absolute;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:10px solid #2563eb;pointer-events:none}
.ink .x{color:rgba(255,255,255,.7)}
