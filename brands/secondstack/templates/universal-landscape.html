<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Editorial demo</title>
<!-- PREPARE_PAGE_HEAD -->
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:var(--color-page);color:var(--color-ink);font-family:var(--font-ui),sans-serif}
#stage{position:absolute;inset:0;padding:80px 100px;display:flex;flex-direction:column;gap:40px}
header{display:flex;align-items:center;justify-content:space-between;gap:32px;border-bottom:2px solid var(--color-border);padding-bottom:40px}
#brand-logo{width:300px;height:auto;max-height:70px;object-fit:contain;object-position:left}
#brand-name{font:600 30px var(--font-headline),sans-serif;color:var(--color-muted)}
#disclosure{font-size:22px;color:var(--color-muted);letter-spacing:.04em}
#copy{margin:auto 0 0}h1{font:700 88px/1.08 var(--font-headline),sans-serif;letter-spacing:-.035em;margin:0;max-width:100%;overflow-wrap:anywhere}
#subtitle{font-size:34px;line-height:1.4;color:var(--color-muted);margin:28px 0 0;overflow-wrap:anywhere}
#blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:22px 0 auto}
article{background:var(--color-surface);border:2px solid var(--color-border);border-radius:var(--editorial-radius);padding:32px;overflow-wrap:anywhere}

h2{font:600 36px/1.2 var(--font-headline),sans-serif;margin:0 0 16px}article p{font-size:28px;line-height:1.4;color:var(--color-muted);margin:0}
footer{font-size:24px;color:var(--color-muted);border-top:2px solid var(--color-border);padding-top:22px;overflow-wrap:anywhere}
</style></head><body><main id="stage">
<header><img id="brand-logo" alt=""><span id="brand-name"></span></header>
<div id="disclosure"></div><section id="copy"><h1 id="headline"></h1><p id="subtitle"></p></section>
<section id="blocks"></section><footer id="footer"></footer></main>
<script>
'use strict';
const data=window.PAGE_DATA,brand=window.PAGE_BRAND;
const set=(id,value)=>{document.getElementById(id).textContent=value||'';};
document.getElementById('brand-name').remove();document.title=data.headline;
const logo=document.getElementById('brand-logo');
if(brand.logo&&brand.logo[brand.editorial.logo_variant]){logo.src=brand.logo[brand.editorial.logo_variant];logo.alt=brand.name;}else{logo.remove();}
set('disclosure',brand.editorial.disclosure);
set('headline',data.headline);set('subtitle',data.subtitle);set('footer',data.footer);
for(const block of data.blocks){const article=document.createElement('article');const h=document.createElement('h2');const p=document.createElement('p');h.textContent=block.title;p.textContent=block.body;article.append(h,p);document.getElementById('blocks').append(article);}
window.DURATION=data.duration;
window.render=function(t){if(!Number.isFinite(t))throw new Error('render(t) requires finite seconds');
const progress=Math.max(0,Math.min(1,t/.65));const eased=1-Math.pow(1-progress,3);
document.getElementById('copy').style.transform=`translateY(${24*(1-eased)}px)`;
document.getElementById('copy').style.opacity='1';
// Absolute-time state only: seeking backwards produces the same DOM frame.
[...document.querySelectorAll('article')].forEach((el,i)=>{const p=Math.max(0,Math.min(1,(t-.2-i*.12)/.5));el.style.opacity='1';el.style.transform=`translateY(${16*(1-p)}px)`;});
};window.render(0);
</script></body></html>
