Your idea + docs</text><text x="130.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Feature, recording, links</text><rect x="250" y="40" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="340.0" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#412402">LinkedIn post</text><text x="340.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Content board, e.g. L161</text><rect x="460" y="40" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="550.0" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#412402">GTM repo script</text><text x="550.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">TZ series, already written</text><rect x="170" y="140" width="340" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Brief</text><text x="340.0" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Idea in one line, anchor source, format</text><rect x="170" y="220" width="340" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Research</text><text x="340.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Agent: RESEARCH.md, sourced claims</text><rect x="170" y="300" width="340" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Script</text><text x="340.0" y="338" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Agent: beats, look, voice gates</text><rect x="170" y="380" width="340" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/><text x="340.0" y="398" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Gate 1: you approve the script</text><text x="340.0" y="418" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Edits loop back to Script</text><rect x="40" y="480" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="180.0" y="498" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">A: ElevenLabs voice</text><text x="180.0" y="518" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">You: paste, export, move to inputs/</text><rect x="360" y="480" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="500.0" y="498" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">B: a human records, e.g. Tatiana</text><text x="500.0" y="518" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Days to weeks; files to inputs/</text><rect x="360" y="560" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="500.0" y="578" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Take log + voice clean</text><text x="500.0" y="598" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Agent: NOTES.md, 12 dB cap</text><rect x="360" y="640" width="280" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/><text x="500.0" y="658" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Gate 2: you pick the lines</text><text x="500.0" y="678" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Keep, drop, reorder</text><rect x="360" y="720" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="500.0" y="738" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Cut on silence</text><text x="500.0" y="758" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Agent: joins tested, ≤ 40 s</text><rect x="170" y="820" width="340" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="838" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Timed voice track</text><text x="340.0" y="858" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Agent: word start times</text><rect x="170" y="900" width="340" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="918" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Animation page + render</text><text x="340.0" y="938" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Agent: template, stills check, frames</text><rect x="170" y="980" width="340" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="998" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Sound, captions, thumbnail, copy</text><text x="340.0" y="1018" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Agent: −14 LUFS, srt, publish.md</text><rect x="170" y="1060" width="340" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/><text x="340.0" y="1078" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Gate 3: your ear and eye check</text><text x="340.0" y="1098" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Notes loop back, new version</text><rect x="170" y="1140" width="340" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="1158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">publish/ ready</text><text x="340.0" y="1178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">mp4, thumbnail, srt, copy</text><rect x="170" y="1220" width="340" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="340.0" y="1238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#412402">You upload to YouTube</text><text x="340.0" y="1258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Rename folder uploaded_…, pin comment</text><rect x="40" y="1320" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517"/><text x="62" y="1327" dominant-baseline="central" font-size="12" fill="#444441">Human input or action</text><rect x="220" y="1320" width="14" height="14" rx="3" fill="#FAECE7" stroke="#D85A30"/><text x="242" y="1327" dominant-baseline="central" font-size="12" fill="#444441">Approval gate</text><rect x="360" y="1320" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7F77DD"/><text x="382" y="1327" dominant-baseline="central" font-size="12" fill="#444441">AI voice</text><rect x="460" y="1320" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75"/><text x="482" y="1327" dominant-baseline="central" font-size="12" fill="#444441">Human voice</text><rect x="570" y="1320" width="14" height="14" rx="3" fill="#F7F6F2" stroke="#B4B2A9"/><text x="592" y="1327" dominant-baseline="central" font-size="12" fill="#444441">Agent</text></svg>