<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Scene video</title>
<!-- PREPARE_PAGE_HEAD -->
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--color-page);color:var(--color-ink);font-family:var(--font-ui),sans-serif;
  /* Frame geometry. Overridden per delivery format below; vertical uses the shared Shorts safe zone. */
  --pad-top:clamp(24px,4vw,72px);--pad-right:clamp(36px,7vw,120px);--pad-bottom:clamp(36px,5vw,90px);--pad-left:clamp(36px,7vw,120px);
  --header-h:clamp(48px,6vw,90px);--gap:clamp(16px,2.2vw,36px);
  --logo-h:clamp(36px,4.2vw,70px);--logo-w:min(28vw,300px);--disclosure-size:clamp(12px,1.3vw,20px);
  --h1:clamp(48px,7vw,112px);--h2:clamp(34px,4.5vw,76px);--p:clamp(20px,2.3vw,38px);--eyebrow:clamp(14px,1.5vw,24px);
  --value:clamp(64px,11vw,180px);--step-title:clamp(22px,2.5vw,38px);--step-body:clamp(16px,1.7vw,26px);--step-cols:3;
  --cta:clamp(18px,2vw,32px);--caption:clamp(18px,2vw,32px);--media-h:56vh;--text-w:34ch}
body[data-format="horizontal"]{--pad-top:56px;--pad-right:120px;--pad-bottom:72px;--pad-left:120px;--header-h:70px;--gap:32px;
  --logo-h:58px;--logo-w:300px;--disclosure-size:19px;--h1:108px;--h2:70px;--p:36px;--eyebrow:24px;--value:176px;
  --step-title:36px;--step-body:25px;--step-cols:3;--cta:32px;--caption:30px;--media-h:610px}
body[data-format="square"]{--pad-top:48px;--pad-right:72px;--pad-bottom:64px;--pad-left:72px;--header-h:56px;--gap:24px;
  --logo-h:46px;--logo-w:240px;--disclosure-size:16px;--h1:78px;--h2:56px;--p:30px;--eyebrow:20px;--value:150px;
  --step-title:28px;--step-body:21px;--step-cols:3;--cta:28px;--caption:26px;--media-h:560px;--text-w:30ch}
body[data-format="vertical"]{--pad-top:var(--shorts-top,250px);--pad-right:var(--shorts-right,210px);--pad-bottom:var(--shorts-bottom,390px);--pad-left:var(--shorts-left,70px);
  --header-h:64px;--gap:28px;--logo-h:52px;--logo-w:300px;--disclosure-size:17px;--h1:84px;--h2:60px;--p:34px;--eyebrow:22px;--value:170px;
  --step-title:34px;--step-body:26px;--step-cols:1;--cta:32px;--caption:30px;--media-h:720px;--text-w:24ch}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--color-page)}
#grid{position:absolute;inset:-10%;opacity:.4;background-image:linear-gradient(color-mix(in srgb,var(--color-border) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--color-border) 55%,transparent) 1px,transparent 1px);background-size:clamp(32px,4vw,72px) clamp(32px,4vw,72px);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 82%)}
#brand{position:absolute;top:var(--pad-top);left:var(--pad-left);right:var(--pad-right);height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:24px;z-index:20}
body[data-format="vertical"] #brand{flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;height:auto}
#brand-logo{max-width:var(--logo-w);max-height:var(--logo-h);object-fit:contain;object-position:left}
#brand-name{font:600 calc(var(--logo-h)*.6) var(--font-headline),sans-serif;color:var(--color-ink)}
#disclosure{font-size:var(--disclosure-size);color:var(--color-muted);letter-spacing:.04em;text-align:right;max-width:55%}
body[data-format="vertical"] #disclosure{text-align:left;max-width:100%}
#scenes{position:absolute;left:var(--pad-left);right:var(--pad-right);top:calc(var(--pad-top) + var(--header-h) + var(--gap));bottom:var(--pad-bottom);z-index:5}
body[data-format="vertical"] #scenes{top:calc(var(--pad-top) + var(--header-h) + var(--gap) + 34px)}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;text-align:center;will-change:opacity,transform}
.scene-inner{width:100%;max-height:100%}
.scene h1,.scene h2{font:700 var(--h1)/1.05 var(--font-headline),sans-serif;letter-spacing:-.04em;margin:0 auto;max-width:18ch;overflow-wrap:anywhere}
.scene h2{font-size:var(--h2);max-width:20ch}
.scene p{font-size:var(--p);line-height:1.35;color:var(--color-muted);max-width:var(--text-w);margin:calc(var(--gap)*.9) auto 0}
.eyebrow{font-size:var(--eyebrow);letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent);font-weight:600;margin-bottom:calc(var(--gap)*.7)}
.value{font:800 var(--value)/.95 var(--font-headline),sans-serif;letter-spacing:-.055em;color:var(--color-primary);margin:calc(var(--gap)*.6) 0}
.steps{display:grid;grid-template-columns:repeat(var(--step-cols),minmax(0,1fr));gap:var(--gap);margin-top:var(--gap);text-align:left}
.step{background:var(--color-surface);border:2px solid var(--color-border);border-top:7px solid var(--color-accent);border-radius:var(--editorial-radius,18px);padding:calc(var(--gap)*1.05)}
.step b{display:block;font:600 var(--step-title)/1.2 var(--font-headline),sans-serif}
.step span{display:block;color:var(--color-muted);font-size:var(--step-body);line-height:1.35;margin-top:10px}
.screen{display:flex;flex-direction:column;align-items:center;gap:calc(var(--gap)*.7)}
.screen h2{font-size:calc(var(--h2)*.8)}
.screen-media{display:block;max-width:100%;max-height:var(--media-h);object-fit:contain;border:2px solid var(--color-border);border-radius:var(--editorial-radius,22px);background:var(--color-surface);box-shadow:0 24px 70px color-mix(in srgb,var(--color-ink) 18%,transparent)}
.screen-caption{font-size:var(--caption);color:var(--color-muted);max-width:var(--text-w)}
.cta{display:flex;flex-direction:column;align-items:center}
.cta-pill{display:inline-flex;align-items:center;gap:14px;background:var(--color-primary);color:var(--color-on_primary,#FFFFFF);border-radius:999px;padding:.55em 1.1em;font-size:var(--cta);font-weight:600;margin-top:calc(var(--gap)*1.1)}
body[data-format="responsive"] #scenes{top:clamp(110px,14vw,220px)}
@media(max-width:720px){body[data-format="responsive"]{--step-cols:1;--h1:clamp(42px,11vw,76px);--p:clamp(18px,5vw,28px)}}
</style></head><body><main id="stage"><div id="grid"></div>
<header id="brand"><img id="brand-logo" alt=""><span id="brand-name"></span><span id="disclosure"></span></header>
<section id="scenes"></section></main>
<script>
'use strict';
const data=window.PAGE_DATA,brand=window.PAGE_BRAND||{},format=window.PAGE_FORMAT||'responsive';
document.body.dataset.format=format;
const root=document.getElementById('scenes');
const editorial=brand.editorial||{};
// Disclosure priority: scene > episode content > brand book > generic editorial notice.
const defaultDisclosure=data.disclosure||editorial.disclosure||(data.demo?'Illustrative example — not product UI.':'');
const disclosureEl=document.getElementById('disclosure');
const logo=document.getElementById('brand-logo'),nameEl=document.getElementById('brand-name');
const logos=brand.logo||{};const variant=editorial.logo_variant||(editorial.theme==='dark'?'dark':'light');
const logoSrc=logos[variant]||logos.light||logos.dark||'';
if(logoSrc){logo.src=logoSrc;logo.alt=brand.name||'';nameEl.remove();}else{logo.remove();nameEl.textContent=brand.name||'';}
const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
const mediaFor=scene=>{if(!scene.src)return null;const isVideo=/\.(mp4|m4v|webm|mov)$/i.test(scene.src);const el=document.createElement(isVideo?'video':'img');el.className='screen-media';el.src=scene.src;if(isVideo){el.muted=true;el.playsInline=true;el.preload='auto';el.setAttribute('aria-label',scene.alt||'');}else{el.alt=scene.alt||'';}return el;};
for(const scene of data.scenes){
  const wrap=make('article','scene');wrap.dataset.start=scene.start;wrap.dataset.end=scene.end;wrap.dataset.kind=scene.kind;wrap.dataset.disclosure=scene.disclosure!==undefined?scene.disclosure:defaultDisclosure;
  const inner=make('div','scene-inner');
  if(scene.kind==='title'){if(scene.eyebrow)inner.append(make('div','eyebrow',scene.eyebrow));inner.append(make('h1',null,scene.title));if(scene.body)inner.append(make('p',null,scene.body));}
  else if(scene.kind==='kpi'){if(scene.eyebrow)inner.append(make('div','eyebrow',scene.eyebrow));inner.append(make('h2',null,scene.title));inner.append(make('div','value',scene.value));if(scene.body)inner.append(make('p',null,scene.body));}
  else if(scene.kind==='steps'){if(scene.eyebrow)inner.append(make('div','eyebrow',scene.eyebrow));inner.append(make('h2',null,scene.title));const grid=make('div','steps');for(const step of scene.steps){const card=make('div','step');card.append(make('b',null,step.title));card.append(make('span',null,step.body));grid.append(card);}inner.append(grid);}
  else if(scene.kind==='screen'){const media=mediaFor(scene);inner.className='scene-inner screen';if(media)inner.append(media);if(scene.title)inner.append(make('h2',null,scene.title));if(scene.body)inner.append(make('div','screen-caption',scene.body));}
  else if(scene.kind==='cta'){inner.className='scene-inner cta';if(scene.eyebrow)inner.append(make('div','eyebrow',scene.eyebrow));inner.append(make('h2',null,scene.title));if(scene.body)inner.append(make('p',null,scene.body));if(scene.button)inner.append(make('div','cta-pill',scene.button+'  →'));}
  wrap.append(inner);root.append(wrap);
}
const scenes=[...root.children];const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function progress(t,start,end){return clamp((t-start)/Math.max(.001,end-start),0,1)}
const waitEvent=(el,name,ms)=>new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);el.removeEventListener(name,finish);resolve();};const timer=setTimeout(finish,ms);el.addEventListener(name,finish,{once:true});});
async function seekVideo(media,time){
  media.pause();
  if(media.readyState<1)await waitEvent(media,'loadedmetadata',5000);
  if(media.readyState<1)throw new Error('Screen video could not be loaded: '+media.currentSrc);
  const target=Number.isFinite(media.duration)?Math.min(time,Math.max(0,media.duration-.001)):time;
  if(Math.abs(media.currentTime-target)>.001||media.readyState<2){
    const seeked=waitEvent(media,'seeked',5000);media.currentTime=target;await seeked;
  }
  if(media.readyState<2)await waitEvent(media,'loadeddata',5000);
  // Make sure the decoded frame for this time is presented before the screenshot.
  if(typeof media.requestVideoFrameCallback==='function')await Promise.race([new Promise(r=>media.requestVideoFrameCallback(()=>r())),new Promise(r=>setTimeout(r,250))]);
}
async function render(t){
  if(!Number.isFinite(t))throw new Error('render(t) requires finite seconds');
  let disclosure=defaultDisclosure;
  for(const el of scenes){const start=Number(el.dataset.start),end=Number(el.dataset.end);const fade=.22;const inP=progress(t,start,start+fade),outP=1-progress(t,end-fade,end);const visible=t>=start&&t<=end;const opacity=visible?Math.min(inP,outP):0;el.style.visibility=visible?'visible':'hidden';el.style.opacity=String(opacity);el.style.transform=`translateY(${(1-inP)*18}px)`;if(visible)disclosure=el.dataset.disclosure;const media=el.querySelector('video');if(media&&visible)await seekVideo(media,clamp(t-start,0,Math.max(0,end-start)));}
  disclosureEl.textContent=disclosure||'';
}
window.DURATION=data.duration;window.render=render;render(0);
</script></body></html>
